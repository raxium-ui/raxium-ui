name: Release

on:
  pull_request:
    types: [closed]
    branches:
      - main
  workflow_dispatch:

jobs:
  # Publishes every public package as a throwaway snapshot under the `oidc` dist-tag,
  # e.g. to validate a newly registered npm trusted publisher. `latest` is untouched
  # and nothing is committed back to the repo.
  snapshot:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create snapshot versions
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const { execSync } = require('node:child_process')
          const fs = require('node:fs')
          const names = JSON.parse(execSync('pnpm -r ls --depth -1 --json', { encoding: 'utf8' }))
            .map(p => JSON.parse(fs.readFileSync(`${p.path}/package.json`, 'utf8')))
            .filter(p => !p.private && p.name?.startsWith('@raxium/'))
            .map(p => p.name)
          const frontmatter = names.map(n => `"${n}": patch`).join('\n')
          fs.writeFileSync('.changeset/snapshot.md', `---\n${frontmatter}\n---\n\nsnapshot\n`)
          fs.writeFileSync(process.env.GITHUB_ENV, `SNAPSHOT_FILTERS=${names.map(n => `--filter=${n}`).join(' ')}\n`, { flag: 'a' })
          console.log(`Snapshot packages (${names.length}): ${names.join(' ')}`)
          EOF
          pnpm changeset version --snapshot oidc

      - name: Build
        shell: bash
        run: pnpm turbo run build $SNAPSHOT_FILTERS

      - name: Publish snapshot
        run: pnpm changeset publish --tag oidc --no-git-tag
        env:
          NPM_CONFIG_PROVENANCE: true

  release:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'changeset-release/main' }}
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      # Trusted Publishing needs npm >= 11.5.1; the one bundled with Node 22 is older.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Build release-target packages
        shell: bash
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          TARGET_SHA="${{ github.event.pull_request.merge_commit_sha }}"

          echo "Detecting release targets from $BASE_SHA -> $TARGET_SHA"

          mapfile -t changed_manifests < <(git diff --name-only "$BASE_SHA" "$TARGET_SHA" -- 'packages/**/package.json' || true)
          package_names=()

          for manifest in "${changed_manifests[@]}"; do
            [[ -n "$manifest" ]] || continue

            before_version=$(git show "${BASE_SHA}:${manifest}" 2>/dev/null | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => { try { const p = JSON.parse(d); process.stdout.write(p.version || ''); } catch {} });")
            after_version=$(git show "${TARGET_SHA}:${manifest}" 2>/dev/null | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => { try { const p = JSON.parse(d); process.stdout.write(p.version || ''); } catch {} });")
            name=$(git show "${TARGET_SHA}:${manifest}" 2>/dev/null | node -e "let d=''; process.stdin.on('data', c => d += c); process.stdin.on('end', () => { try { const p = JSON.parse(d); process.stdout.write(p.name || ''); } catch {} });")

            if [[ -n "$before_version" && -n "$after_version" && "$before_version" != "$after_version" && -n "$name" ]]; then
              package_names+=("$name")
            fi
          done

          if [[ ${#package_names[@]} -eq 0 ]]; then
            echo "No version-bumped packages detected in merged release PR; failing release job."
            exit 1
          fi

          # De-duplicate the package names while preserving order
          unique_packages=()
          declare -A seen=()
          for pkg in "${package_names[@]}"; do
            if [[ -z "${seen[$pkg]+x}" ]]; then
              seen[$pkg]=1
              unique_packages+=("$pkg")
            fi
          done

          # Build --filter arguments from the unique packages
          args=()
          for pkg in "${unique_packages[@]}"; do
            args+=(--filter="${pkg}...")
          done

          echo "Building version-bumped packages: ${unique_packages[*]}"
          pnpm turbo run build "${args[@]}"

      - name: Publish Packages
        run: pnpm changeset publish
        env:
          NPM_CONFIG_PROVENANCE: true
