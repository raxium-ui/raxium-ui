name: Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - changeset-release/main

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      # Library packages only. Storybook / playground inherit ^build locally
      # but are too slow and noisy to gate merges.
      - name: Build packages
        shell: bash
        run: >
          pnpm turbo run build
          --filter="./packages/**"
          --filter="!@raxium/vue-storybook"
          --filter="!@raxium/react-storybook"

      - name: Typecheck
        shell: bash
        run: >
          pnpm turbo run typecheck
          --filter="./packages/**"
          --filter="!@raxium/vue-storybook"
          --filter="!@raxium/react-storybook"
